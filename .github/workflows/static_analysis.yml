name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends clang-18 clang-tidy-18 libcurl4-openssl-dev libssl-dev

      # On pull requests the base branch is analyzed too, so that only findings it lacks can fail the job.
      - name: Analyze the SDK
        run: |
          # Runs clang-tidy over the sources of the checkout in $1 and writes the findings as SARIF to $2.sarif.
          analyze() {
            cd "$1"
            cmake -DCOUNTLY_USE_SQLITE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -B build .
            # run-clang-tidy analyzes nothing, and reports nothing, when its file pattern matches no source.
            if ! grep -qF "\"file\": \"$PWD/src/" build/compile_commands.json; then
              echo "::error title=clang-tidy::The compilation database has no source under $PWD/src"
              exit 1
            fi
            if ! run-clang-tidy-18 -clang-tidy-binary clang-tidy-18 -p build -quiet -header-filter="^$PWD/(include|src)/" \
              -checks='-*,bugprone-*,clang-analyzer-*,concurrency-*,performance-*,portability-*,-bugprone-easily-swappable-parameters' \
              "^$PWD/src/" > "$2.log" 2>&1; then
              tail -n 50 "$2.log"
              exit 1
            fi
            python3 "$GITHUB_WORKSPACE/.github/scripts/clang_tidy_sarif.py" "$2.log" "$2.sarif"
            cd "$GITHUB_WORKSPACE"
          }
          analyze "$GITHUB_WORKSPACE" "$RUNNER_TEMP/clang-tidy"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The first parent of the pull request's merge commit is the base branch it merges into.
            git worktree add "$RUNNER_TEMP/base" HEAD^1
            git -C "$RUNNER_TEMP/base" submodule update --init --recursive
            analyze "$RUNNER_TEMP/base" "$RUNNER_TEMP/clang-tidy-base"
          fi

      # Every finding goes to the job summary; a new one at warning or error level fails the job.
      - name: Summarize the findings
        run: |
          base=()
          if [ -f "$RUNNER_TEMP/clang-tidy-base.sarif" ]; then
            base=(--base "$RUNNER_TEMP/clang-tidy-base.sarif" --base-root "$RUNNER_TEMP/base")
          fi
          python3 .github/scripts/sarif_summary.py clang-tidy "$RUNNER_TEMP/clang-tidy.sarif" "${base[@]}" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/static-analysis.md"

      - name: Write the CI report fragment
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/static-analysis.md" ] || exit 0
          new=$(sed -n 's/^### New compared with the base branch: \([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/static-analysis.md")
          case "$new" in
            '') summary=$(sed -n '1s/^### //p' "$RUNNER_TEMP/static-analysis.md") ;;
            0) summary="No new findings" ;;
            1) summary="1 new finding" ;;
            *) summary="$new new findings" ;;
          esac
          mkdir -p "$RUNNER_TEMP/ci-report-static-analysis"
          {
            printf 'Static analysis\n%s\n' "$summary"
            cat "$RUNNER_TEMP/static-analysis.md"
          } > "$RUNNER_TEMP/ci-report-static-analysis/report.md"

      - name: Upload the CI report fragment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-static-analysis
          path: ${{ runner.temp }}/ci-report-static-analysis
          if-no-files-found: ignore
